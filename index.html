<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة وطباعة إيصالات العقار</title>
    <style>
        /* ============================================================
                   CSS STYLES
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1a3a5c;
            --primary-light: #2c6b9e;
            --primary-dark: #0f2840;
            --bg: #f0f4f9;
            --card-bg: #ffffff;
            --text: #222;
            --text-light: #555;
            --border: #d0d7dd;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #e65100;
            --gray: #757575;
            --font: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #eee;
            --text-light: #bbb;
            --border: #2a3a5a;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ----- ترويسة ----- */
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-right: 6px solid var(--primary);
        }
        .header .brand {
            display: flex;
            flex-direction: column;
        }
        .header .brand h1 {
            font-size: 22px;
            color: var(--primary);
        }
        .header .brand span {
            font-size: 14px;
            color: var(--text-light);
        }
        .header .controls-top {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .header .controls-top input,
        .header .controls-top select,
        .header .controls-top button {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
        }
        .header .controls-top button {
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .header .controls-top button:hover {
            background: var(--primary-light);
        }
        .header .controls-top button.outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .header .controls-top button.outline:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ----- لوحة الإحصائيات ----- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stats .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stats .stat-card .num {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stats .stat-card .label {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* ----- الإعدادات السريعة ----- */
        .quick-settings {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: center;
        }
        .quick-settings label {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
        }
        .quick-settings input,
        .quick-settings select,
        .quick-settings textarea {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            min-width: 80px;
        }
        .quick-settings textarea {
            min-width: 300px;
            min-height: 60px;
            resize: vertical;
            font-family: var(--font);
            line-height: 1.6;
        }
        .quick-settings .fee-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
        }
        .quick-settings .fee-group span {
            font-size: 13px;
        }
        .quick-settings .fee-group input {
            width: 70px;
        }

        /* ----- جدول الوحدات ----- */
        .table-wrap {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-toolbar {
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .table-toolbar input[type="text"] {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            flex: 1;
            min-width: 160px;
        }
        .table-toolbar select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
        }
        .table-toolbar button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }
        .table-toolbar button:hover {
            background: var(--primary-light);
        }
        .table-toolbar button.green {
            background: var(--success);
        }
        .table-toolbar button.red {
            background: var(--danger);
        }
        .table-toolbar button.gray {
            background: var(--gray);
        }

        .table-scroll {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: var(--primary);
            color: #fff;
            padding: 10px 8px;
            text-align: center;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table tr:hover td {
            background: rgba(26, 58, 92, 0.04);
        }
        table td .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #e0e0e0;
            color: #333;
        }
        .badge.owner {
            background: #bbdefb;
            color: #0d47a1;
        }
        .badge.tenant {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .badge.closed {
            background: #f5f5f5;
            color: #616161;
        }
        .badge.living {
            background: #fff3e0;
            color: #e65100;
        }
        .badge.paid {
            background: #a5d6a7;
            color: #1b5e20;
        }
        .badge.unpaid {
            background: #ef9a9a;
            color: #b71c1c;
        }
        .badge.partial {
            background: #ffe082;
            color: #e65100;
        }
        .badge.yes {
            background: #a5d6a7;
            color: #1b5e20;
        }
        .badge.no {
            background: #ef9a9a;
            color: #b71c1c;
        }
        .badge.cash {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .badge.online {
            background: #bbdefb;
            color: #0d47a1;
        }

        table td .actions i {
            cursor: pointer;
            margin: 0 3px;
            color: var(--primary-light);
            font-size: 18px;
        }
        table td .actions i:hover {
            color: var(--primary);
        }

        /* ----- المودال (تعديل وحدة) ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            padding: 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal h2 {
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 20px;
        }
        .modal .close-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
        }
        .modal .close-btn:hover {
            color: var(--danger);
        }
        .modal .field {
            margin-bottom: 12px;
        }
        .modal .field label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 2px;
        }
        .modal .field input,
        .modal .field select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        .modal .field .radio-group {
            display: flex;
            gap: 16px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .modal .field .radio-group label {
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .modal .field .radio-group input[type="radio"],
        .modal .field .radio-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .modal .field .amount-preview {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal .btn-row button {
            padding: 8px 24px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .modal .btn-row .save {
            background: var(--primary);
            color: #fff;
        }
        .modal .btn-row .save:hover {
            background: var(--primary-light);
        }
        .modal .btn-row .cancel {
            background: var(--border);
            color: var(--text);
        }
        .modal .btn-row .cancel:hover {
            background: #bbb;
        }
        .modal .btn-row .delete {
            background: var(--danger);
            color: #fff;
        }
        .modal .btn-row .delete:hover {
            background: #b71c1c;
        }

        /* ----- معاينة الطباعة ----- */
        .print-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .print-preview-overlay.open {
            display: flex;
        }
        .print-preview-box {
            background: #fff;
            border-radius: var(--radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }
        .print-preview-box .close-preview {
            position: sticky;
            top: 0;
            float: left;
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            z-index: 5;
        }
        .print-preview-box .preview-content {
            background: #fff;
            color: #000;
            padding: 10px;
        }
        .print-preview-box .preview-content .receipt-grid {
            display: grid;
            gap: 12px;
            direction: rtl;
        }
        .print-preview-box .preview-content .receipt-grid.cols-1 {
            grid-template-columns: 1fr;
        }
        .print-preview-box .preview-content .receipt-grid.cols-2 {
            grid-template-columns: 1fr 1fr;
        }
        .print-preview-box .preview-content .receipt-grid.cols-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .print-preview-box .preview-content .receipt-grid.cols-4 {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .print-preview-box .preview-content .receipt-grid.cols-6 {
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
        }

        /* ============================================================
           الإيصال الجديد
           ============================================================ */
        .receipt-print {
            border: 2px solid #1a3a5c;
            border-radius: 6px;
            padding: 10px 12px 8px;
            background: #fff;
            font-size: 12px;
            line-height: 1.6;
            color: #000;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            direction: rtl;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .receipt-print .r-header {
            text-align: center;
            border-bottom: 2px solid #1a3a5c;
            padding-bottom: 4px;
            margin-bottom: 5px;
        }
        .receipt-print .r-header .r-building {
            font-size: 14px;
            font-weight: 700;
            color: #1a3a5c;
        }
        .receipt-print .r-header .r-address {
            font-size: 11px;
            color: #333;
        }
        .receipt-print .r-header .r-receipt-type {
            font-size: 16px;
            font-weight: 700;
            color: #1a3a5c;
            margin-top: 3px;
            padding: 2px 0;
            border-top: 1px dashed #1a3a5c;
            border-bottom: 1px dashed #1a3a5c;
            display: inline-block;
            padding: 2px 16px;
        }
        .receipt-print .r-body {
            flex: 1;
        }
        .receipt-print .r-body .r-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #ccc;
            padding: 3px 0;
        }
        .receipt-print .r-body .r-row .r-label {
            font-weight: 600;
            color: #1a3a5c;
            font-size: 12px;
        }
        .receipt-print .r-body .r-row .r-value {
            font-weight: 500;
            font-size: 13px;
        }
        .receipt-print .r-body .r-amount {
            background: #f0f5fb;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin: 5px 0;
            border: 2px solid #1a3a5c;
        }
        /* البيان الرئيسي */
        .receipt-print .r-body .r-statement {
            background: #f9f9f9;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            margin: 5px 0;
            border: 2px solid #ddd;
            min-height: 40px;
            text-align: center;
            color: #1a3a5c;
            word-wrap: break-word;
        }
        /* نقاط البيان */
        .receipt-print .r-body .r-statement-items {
            background: #f9f9f9;
            padding: 8px 14px;
            border-radius: 4px;
            margin: 4px 0;
            border: 2px solid #ddd;
            font-size: 14px;
            line-height: 2;
        }
        .receipt-print .r-body .r-statement-items .item {
            display: block;
            padding-right: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .receipt-print .r-body .r-statement-items .item::before {
            content: "• ";
            color: #1a3a5c;
            font-weight: 700;
            font-size: 16px;
        }
        .receipt-print .r-body .r-statement-items .note {
            display: block;
            padding-right: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #c62828;
            margin-top: 2px;
            border-top: 1px dashed #c62828;
            padding-top: 3px;
        }
        .receipt-print .r-body .r-statement-items .note::before {
            content: "║ ";
            color: #c62828;
            font-weight: 700;
        }
        .receipt-print .r-footer {
            border-top: 2px solid #1a3a5c;
            margin-top: 5px;
            padding-top: 5px;
            display: flex;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #1a3a5c;
        }
        .receipt-print .r-footer .r-owner {
            letter-spacing: 1px;
        }
        .receipt-print .r-id {
            text-align: left;
            font-size: 9px;
            color: #999;
            margin-top: 2px;
        }

        /* ----- الإعدادات (المودال) ----- */
        .settings-modal .modal {
            max-width: 700px;
        }
        .settings-modal .field-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
        }
        .settings-modal .field-group .field {
            margin-bottom: 0;
        }
        .settings-modal .field-group .field.full {
            grid-column: 1 / -1;
        }

        /* ----- متفرقات ----- */
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-light);
            font-size: 12px;
        }
        .w-full {
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .text-red {
            color: #c62828;
        }
        .border-red {
            border-color: #c62828 !important;
        }

        /* ----- الطباعة ----- */
        @media print {
            body * {
                visibility: hidden;
            }
            .print-preview-overlay,
            .print-preview-overlay * {
                visibility: visible;
            }
            .print-preview-overlay {
                position: static;
                background: none;
                padding: 0;
                display: block !important;
            }
            .print-preview-box {
                max-width: 100%;
                max-height: 100%;
                padding: 0;
                box-shadow: none;
                border-radius: 0;
                background: #fff;
            }
            .print-preview-box .close-preview,
            .print-preview-box .print-actions {
                display: none !important;
            }
            .print-preview-box .preview-content .receipt-grid {
                gap: 8px;
            }
            .receipt-print {
                border-color: #000;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .receipt-print .r-header .r-building {
                color: #000;
            }
            .receipt-print .r-header .r-receipt-type {
                color: #000;
                border-color: #000;
            }
            .receipt-print .r-body .r-amount {
                background: #f0f0f0;
                border-color: #000;
            }
            .receipt-print .r-body .r-statement {
                color: #000;
                border-color: #000;
            }
            .receipt-print .r-body .r-statement-items {
                border-color: #000;
            }
            .receipt-print .r-body .r-statement-items .item {
                color: #000;
            }
            .receipt-print .r-body .r-statement-items .note {
                color: #b71c1c;
                border-color: #b71c1c;
            }
            .receipt-print .r-footer {
                border-color: #000;
                color: #000;
            }
        }

        /* ----- تنسيق خاص للبيان غير الصيانة الشهرية ----- */
        .quick-settings .template-hint {
            font-size: 12px;
            color: var(--text-light);
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px dashed var(--border);
        }
        .quick-settings .template-hint strong {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- ===================== الترويسة ===================== -->
        <header class="header">
            <div class="brand">
                <h1>🏢 ملاك برج مريم</h1>
                <span>31 ش الأمراء التعاون - فيصل</span>
            </div>
            <div class="controls-top">
                <input type="text" id="searchInput" placeholder="🔍 بحث باسم أو شقة..." />
                <select id="filterSelect">
                    <option value="all">الكل</option>
                    <option value="living">الساكنة</option>
                    <option value="closed">المغلقة</option>
                    <option value="owner">الملاك</option>
                    <option value="tenant">المستأجرين</option>
                    <option value="elevator_yes">يستخدم الأسانسير</option>
                    <option value="elevator_no">لا يستخدم الأسانسير</option>
                    <option value="paid">مدفوع</option>
                    <option value="unpaid">غير مدفوع</option>
                    <option value="debt">عليهم ديون</option>
                    <option value="cash">كاش (Chash)</option>
                    <option value="online">أونلاين (On-line)</option>
                </select>
                <button onclick="toggleDarkMode()">🌙</button>
                <button onclick="openSettings()">⚙️</button>
            </div>
        </header>

        <!-- ===================== الإحصائيات ===================== -->
        <div class="stats" id="statsContainer">
            <!-- يتم تعبئتها بواسطة JS -->
        </div>

        <!-- ===================== الإعدادات السريعة ===================== -->
        <div class="quick-settings">
            <div>
                <label>نوع الإيصال</label>
                <select id="templateSelect" onchange="onTemplateChange()">
                    <option value="monthly">صيانة شهرية</option>
                    <option value="electricity">كهرباء</option>
                    <option value="water">مياه</option>

                    units = JSON.parse(JSON.stringify(DEFAULT_UNITS));
                }

                units = JSON.parse(JSON.stringify(DEFAULT_UNITS));
            }
            loadSettings();
            const savedSel = localStorage.getItem('selectedIds');
            if (savedSel) {
                try { selectedIds = new Set(JSON.parse(savedSel)); } catch (e) { selectedIds = new Set(); }
            }
            render();
            updateStats();
            document.getElementById('searchInput').addEventListener('input', render);
            document.getElementById('filterSelect').addEventListener('change', render);

            onTemplateChange();

            localStorage.setItem('buildingUnits', JSON.stringify(units));
            localStorage.setItem('selectedIds', JSON.stringify([...selectedIds]));
        }

        // ----- حساب المبلغ تلقائياً -----
        function calcAmount(unit) {
            if (unit.status === 'مغلقة') return 0;
            if (unit.type === 'مغلق') return 0;
            const feeOwnerElev = parseInt(document.getElementById('feeOwnerElevator').value) || 170;
            const feeOwnerNoElev = parseInt(document.getElementById('feeOwnerNoElevator').value) || 150;
            const feeTenant = parseInt(document.getElementById('feeTenant').value) || 220;
            if (unit.type === 'مستأجر') return feeTenant;
            if (unit.type === 'مالك') {
                return unit.elevator === 'yes' ? feeOwnerElev : feeOwnerNoElev;
            }
            return 0;
        }

        function recalcAll() {
            units.forEach(u => {
                u.amount = calcAmount(u);
            });
            saveData();
            render();
            updateStats();
        }

        function saveFees() {
            recalcAll();
        }

        function render() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const filter = document.getElementById('filterSelect').value;
            const tbody = document.getElementById('unitsTableBody');
            tbody.innerHTML = '';
            let filtered = units.filter(u => {
                if (search) {
                    const match = u.resident.toLowerCase().includes(search) ||
                        u.number.includes(search) ||
                        u.floor.includes(search);
                    if (!match) return false;
                }
                switch (filter) {
                    case 'living':
                        return u.status === 'ساكنة';
                    case 'closed':
                        return u.status === 'مغلقة';
                    case 'owner':
                        return u.type === 'مالك';
                    case 'tenant':
                        return u.type === 'مستأجر';
                    case 'elevator_yes':
                        return u.elevator === 'yes';
                    case 'elevator_no':
                        return u.elevator === 'no';
                    case 'paid':
                        return u.paymentStatus === 'مدفوع';
                    case 'unpaid':
                        return u.paymentStatus === 'غير مدفوع';
                    case 'debt':
                        return u.debt > 0;
                    case 'cash':
                        return u.paymentMethod === 'كاش';
                    case 'online':
                        return u.paymentMethod === 'أونلاين';
                    default:
                        return true;
                }
            });
            const floorOrder = ['البدروم', 'الأول', 'الثانى', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع',
                'العاشر', 'الحادى عشر', 'الثانى عشر', 'الثالث عشر'
            ];
            filtered.sort((a, b) => {
                const ia = floorOrder.indexOf(a.floor);
                const ib = floorOrder.indexOf(b.floor);
                if (ia !== ib) return ia - ib;
                return parseInt(a.number) - parseInt(b.number);
            });
            filtered.forEach(u => {
                const tr = document.createElement('tr');
                const checked = selectedIds.has(u.id) ? 'checked' : '';
                const statusBadge = u.status === 'ساكنة' ? 'living' : 'closed';
                const typeBadge = u.type === 'مالك' ? 'owner' : u.type === 'مستأجر' ? 'tenant' : 'closed';
                const elevBadge = u.elevator === 'yes' ? 'yes' : 'no';
                const payBadge = u.paymentStatus === 'مدفوع' ? 'paid' : u.paymentStatus === 'مدفوع جزئياً' ? 'partial' :
                    'unpaid';
                const methodBadge = u.paymentMethod === 'كاش' ? 'cash' : u.paymentMethod === 'أونلاين' ? 'online' : '';
                tr.innerHTML = `
                        <td><input type="checkbox" data-id="${u.id}" ${checked} onchange="toggleSelect(${u.id})" /></td>
                        <td>${u.id}</td>
                        <td>${u.floor}</td>
                        <td>${u.number}</td>
                        <td style="font-weight:600;">${u.resident}</td>
                        <td><span class="badge ${statusBadge}">${u.status}</span></td>
                        <td><span class="badge ${typeBadge}">${u.type}</span></td>
                        <td><span class="badge ${elevBadge}">${u.elevator === 'yes' ? '✅' : '❌'}</span></td>
                        <td style="font-weight:700;color:var(--primary);">${u.amount}</td>
                        <td><span class="badge ${payBadge}">${u.paymentStatus}</span></td>
                        <td>${u.debt > 0 ? u.debt : '—'}</td>
                        <td style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${u.notes || '—'}</td>
                        <td>${u.paymentMethod ? `<span class="badge ${methodBadge}">${u.paymentMethod}</span>` : '—'}</td>
                        <td class="actions">
                            <i onclick="editUnit(${u.id})" title="تعديل">✏️</i>
                            <i onclick="printSingle(${u.id})" title="طباعة إيصال">🖨️</i>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
            updateStats();
            saveData();

        function updateStats() {
            const total = units.length;
            const living = units.filter(u => u.status === 'ساكنة').length;
            const closed = units.filter(u => u.status === 'مغلقة').length;
            const owners = units.filter(u => u.type === 'مالك').length;
            const tenants = units.filter(u => u.type === 'مستأجر').length;
            const totalAmount = units.reduce((s, u) => s + u.amount, 0);
            const totalPaid = units.reduce((s, u) => s + u.paid, 0);
            const totalDebt = units.reduce((s, u) => s + u.debt, 0);
            const remaining = totalAmount - totalPaid;
            const cashCount = units.filter(u => u.paymentMethod === 'كاش').length;
            const onlineCount = units.filter(u => u.paymentMethod === 'أونلاين').length;
            document.getElementById('statsContainer').innerHTML = `

        function updateEditAmountPreview() {
            const status = document.querySelector('input[name="editStatus"]:checked')?.value || 'ساكنة';
            const type = document.querySelector('input[name="editType"]:checked')?.value || 'مالك';
            const elevator = document.querySelector('input[name="editElevator"]:checked')?.value || 'yes';
            const feeOwnerElev = parseInt(document.getElementById('feeOwnerElevator').value) || 170;
            const feeOwnerNoElev = parseInt(document.getElementById('feeOwnerNoElevator').value) || 150;
            const feeTenant = parseInt(document.getElementById('feeTenant').value) || 220;
            let amount = 0;
            if (status === 'مغلقة') amount = 0;
            else if (type === 'مستأجر') amount = feeTenant;
            else if (type === 'مالك') amount = elevator === 'yes' ? feeOwnerElev : feeOwnerNoElev;
            document.getElementById('editAmountPreview').textContent = amount + ' ج.م';
            document.getElementById('editAmount').value = amount;
        }

        function getSelectedUnits() {
            const checked = document.querySelectorAll('#unitsTableBody input[type="checkbox"]:checked');
            const ids = [];
            checked.forEach(cb => ids.push(parseInt(cb.dataset.id)));
            let result = units.filter(u => ids.includes(u.id));

            // تطبيق فلتر الطباعة
            const printFilter = document.getElementById('printFilterSelect').value;
            if (printFilter === 'living') {
                result = result.filter(u => u.status === 'ساكنة');
            } else if (printFilter === 'owners') {
                result = result.filter(u => u.type === 'مالك');
            } else if (printFilter === 'tenants') {
                result = result.filter(u => u.type === 'مستأجر');
            } else if (printFilter === 'elevator_yes') {
                result = result.filter(u => u.elevator === 'yes');
            } else if (printFilter === 'elevator_no') {
                result = result.filter(u => u.elevator === 'no');
            } else if (printFilter === 'cash') {
                result = result.filter(u => u.paymentMethod === 'كاش');
            } else if (printFilter === 'online') {
                result = result.filter(u => u.paymentMethod === 'أونلاين');
            }
            return result;
        }

                        item.includes('أسانسير') ||

        function previewSelected() {
            const sel = getSelectedUnits();
            if (sel.length === 0) { alert('الرجاء تحديد وحدات للطباعة'); return; }
            showPreview(sel);
        }

        function printSelected() {
            const sel = getSelectedUnits();
            if (sel.length === 0) { alert('الرجاء تحديد وحدات للطباعة'); return; }
            showPreview(sel);
            setTimeout(() => {
                const btn = document.querySelector('.print-actions button');
                if (btn) btn.click();
            }, 500);
        }

        function printSingle(id) {
            const u = units.find(x => x.id === id);
            if (!u) return;
            selectedIds.add(id);
            saveData();
            render();
            showPreview([u]);
            setTimeout(() => {
                const btn = document.querySelector('.print-actions button');
                if (btn) btn.click();
            }, 500);
        }

        function showPreview(unitsList) {
            const overlay = document.getElementById('printPreviewOverlay');
            const content = document.getElementById('previewContent');
            const cols = parseInt(document.getElementById('colsPerPage').value) || 2;
            let html = `<div class="receipt-grid cols-${cols}">`;
            unitsList.forEach((u, i) => {
                html += buildReceiptHTML(u, i);
            });
            html += '</div>';
            content.innerHTML = html;
            overlay.classList.add('open');
        }

        function closePreview() {
            document.getElementById('printPreviewOverlay').classList.remove('open');
        }

        function printPreview() {
            window.print();
        }

        // ================================================================
        //  تصدير / استيراد JSON
        // ================================================================
        function exportJSON() {
            const data = {
                units: units,
                settings: {
                    feeOwnerElevator: document.getElementById('feeOwnerElevator').value,
                    feeOwnerNoElevator: document.getElementById('feeOwnerNoElevator').value,
                    feeTenant: document.getElementById('feeTenant').value,
                    buildingName: document.getElementById('setBuildingName').value,
                    buildingAddress: document.getElementById('setBuildingAddress').value
                },
                selected: [...selectedIds],
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'building_data_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.units && Array.isArray(data.units)) {
                        if (confirm('سيتم استبدال جميع البيانات الحالية. هل تريد المتابعة؟')) {
                            units = data.units;
                            if (data.selected) selectedIds = new Set(data.selected);
                            if (data.settings) {
                                if (data.settings.feeOwnerElevator) document.getElementById('feeOwnerElevator')
                                    .value = data.settings.feeOwnerElevator;
                                if (data.settings.feeOwnerNoElevator) document.getElementById('feeOwnerNoElevator')
                                    .value = data.settings.feeOwnerNoElevator;
                                if (data.settings.feeTenant) document.getElementById('feeTenant').value = data
                                    .settings.feeTenant;
                                if (data.settings.buildingName) document.getElementById('setBuildingName').value =
                                    data.settings.buildingName;
                                if (data.settings.buildingAddress) document.getElementById('setBuildingAddress')
                                    .value = data.settings.buildingAddress;
                                updateHeader();
                            }
                            saveData();
                            render();
                            updateStats();
                            alert('✅ تم استيراد البيانات بنجاح');
                        }
                    } else {
                        alert('❌ ملف غير صالح');
                    }
                } catch (err) {
                    alert('❌ خطأ في قراءة الملف: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ================================================================
        //  إعادة ضبط
        // ================================================================
        function resetAll() {
            if (!confirm('⚠️ هل أنت متأكد من إعادة ضبط جميع البيانات إلى الوضع الافتراضي؟')) return;
            if (!confirm('تأكيد إعادة الضبط؟ سيتم فقدان جميع التغييرات.')) return;
            units = JSON.parse(JSON.stringify(DEFAULT_UNITS));
            selectedIds = new Set();
            localStorage.removeItem('buildingUnits');
            localStorage.removeItem('selectedIds');
            document.getElementById('feeOwnerElevator').value = 170;
            document.getElementById('feeOwnerNoElevator').value = 150;
            document.getElementById('feeTenant').value = 220;
            document.getElementById('setBuildingName').value = 'ملاك برج مريم';
            document.getElementById('setBuildingAddress').value = '31 ش الأمراء التعاون - فيصل';
            document.getElementById('setFeeOwnerElev').value = 170;
            document.getElementById('setFeeOwnerNoElev').value = 150;
            document.getElementById('setFeeTenant').value = 220;
            document.getElementById('receiptStatement').value = 'إيصال الصيانة الشهرية';
            document.getElementById('receiptItems').value = 'إيصال الكهرباء الشهري\nإيصال الصيانة الشهرية للاسانسير\nصيانة العقار العامة';
            document.getElementById('receiptNote').value = 'ملاحظة: يرجى السداد قبل نهاية الشهر';
            document.getElementById('templateSelect').value = 'monthly';
            updateHeader();
            saveData();
            render();

            onTemplateChange();
            alert('✅ تم إعادة ضبط البيانات');
        }

        // ================================================================
        //  الوضع الليلي
        // ================================================================
        function toggleDarkMode() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            localStorage.setItem('darkMode', darkMode ? 'true' : 'false');
        }

        // ================================================================
        //  بدء التشغيل
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('darkMode') === 'true') {
                darkMode = true;
                document.body.classList.add('dark');
            }
            init();
            updateHeader();
            setTimeout(recalcAll, 100);
        });

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                }
            });
        });
